---
# image is the configuration for the container images
image:
  # repository is the container image repository
  repository: ghcr.io/linuxfoundation/lfx-v2-formation-service/formation-api
  # tag is the container image tag (overrides appVersion from Chart.yaml)
  tag: ""
  # pullPolicy is the image pull policy
  pullPolicy: IfNotPresent

# replicaCount is the number of replicas for the deployment
replicaCount: 1

# topologySpreadConstraints controls how pods are spread across nodes/zones.
# Empty by default (no constraints). Example:
#   - maxSkew: 1
#     topologyKey: kubernetes.io/hostname
#     whenUnsatisfiable: DoNotSchedule
#     labelSelector:
#       matchLabels:
#         app: lfx-v2-formation-service
topologySpreadConstraints: []

# terminationGracePeriodSeconds is how long Kubernetes waits after SIGTERM
# before killing the pod.
#
# Set explicitly because the service's own shutdown budget adds up to more than
# the 30s default. The three stages run in sequence and their budgets add:
# event handlers drain for up to 10s, then the HTTP server gets 25s to finish
# in-flight requests, then in-flight index refreshes drain for up to 5s. The
# refreshes come last because they are started by those requests and read
# Postgres, so they cannot be drained earlier or after the pool is released.
#
# 50 covers the 40s sum with a 10s margin. Raise this together with
# DefaultListenerDrainTimeout, DefaultShutdownTimeout or
# DefaultRefreshDrainTimeout if any of them changes — the kill arriving
# mid-drain is silent from inside the service.
terminationGracePeriodSeconds: 50

# podAnnotations are additional annotations applied to the pod template.
# Example:
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "8080"
podAnnotations: {}

# podLabels are additional labels applied to the pod template.
# Example:
#   team: platform
#   environment: production
podLabels: {}

# podDisruptionBudget configures a PodDisruptionBudget for the deployment.
# Only one of minAvailable or maxUnavailable may be set (not both).
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

# resources is the configuration for container resource requests and limits
resources:
  # limits is the maximum amount of resources allowed
  limits:
    cpu: 500m
    memory: 512Mi
  # requests is the minimum amount of resources required
  requests:
    cpu: 100m
    memory: 128Mi

# traefik is the configuration for Traefik Gateway API routing
traefik:
  # gateway specifies the platform Gateway to attach to
  gateway:
    # name is the name of the Gateway resource
    name: lfx-platform-gateway
    # namespace is the namespace of the Gateway resource
    namespace: lfx

# lfx is the configuration for LFX platform
lfx:
  # domain is the base domain for routing
  domain: k8s.orb.local
  # namespace is the target namespace for deployment
  namespace: lfx

# service is the configuration for the Kubernetes service
service:
  # port is the service port
  port: 8080

# database configures the PostgreSQL backend. The service applies its own
# schema at startup (internal/infrastructure/postgres/schema.sql), so it
# only ever needs an empty, owned database — never a migration step here.
database:
  # mode selects the database provider:
  #   "external"         — connect to an existing PostgreSQL instance via a
  #                        Kubernetes Secret. This is the mode every
  #                        deployed environment uses, against the shared
  #                        LFX v2 RDS instance provisioned by lfx-v2-opentofu.
  #   "database"         — create a CloudNativePG Database CR pointing at an
  #                        existing Cluster (e.g. provisioned by the umbrella
  #                        chart). Local-dev shared-Postgres setups only.
  #   "cluster+database" — create both a CloudNativePG Cluster CR and a
  #                        Database CR. Standalone local dev only.
  mode: external

  # cloudNativePG configures access to a CloudNativePG Cluster (modes:
  # "database" and "cluster+database"). Not used by any deployed environment.
  cloudNativePG:
    clusterName: ""
    databaseName: formation
    cluster:
      instances: 1
      storage:
        size: 1Gi

  # external configures an existing PostgreSQL connection (mode: external
  # only). shape is always "fields" here: the provisioned secret carries
  # host/port/username/password/dbname as five separate keys, not a single
  # DATABASE_URL — see externalsecret.yaml and the ArgoCD values that
  # populate externalSecretsOperator.externalSecret.data.
  external:
    # secretName is the K8s Secret the five PG* env vars read from. Matches
    # the ExternalSecret's target name, which defaults to the chart name.
    secretName: ""
    shape: "fields"
    # keys maps each DSN field to a secret key. Defaults match the live
    # newsletter ExternalSecret in dev, which reads the same five keys —
    # "user" and "database" are not the keys.
    keys:
      host: host
      port: port
      username: username
      password: password
      dbname: dbname

# externalSecretsOperator pulls the RDS credential JSON from AWS Secrets
# Manager and splits it into individual keys. Disabled by default; the
# ArgoCD values for dev/staging/prod enable it and supply the five-entry
# data list against /cloudops/rds-managed/lfx-v2/formation.
externalSecretsOperator:
  enabled: false
  externalSecret:
    refreshInterval: "1h"
    # data is a list of { secretKey, remoteRef: { key, property? } } entries.
    data: []

# global is the umbrella-chart scope. awsRegion gates ExternalSecret /
# SecretStore rendering and is normally set by the parent chart.
global:
  awsRegion: ""

# networkPolicy controls the Kubernetes NetworkPolicy for this workload.
# Allows egress to DNS, NATS (service-to-service request/reply, including
# the platform-resolved-item and project-settings reads), OTel, Postgres
# and Heimdall (JWT validation and the authorization gateway it fronts).
networkPolicy:
  enabled: true
  natsPort: 4222
  otelGRPCPort: 4317
  otelHTTPPort: 4318
  postgresPort: 5432
  heimdallPort: 4456
  heimdallJWKSPort: 4457
  # httpsPort is outbound 443, for the platform-check lookups: the query
  # service they read and the identity provider their token comes from. Both
  # are external to the cluster, so they need an egress rule that the
  # in-cluster ports above do not cover.
  httpsPort: 443

# openfga is the configuration for the OpenFGA server
openfga:
  # enabled is a boolean to determine if the OpenFGA server should be enabled for authorization
  # Note: If it is disabled, then the service will allow all requests
  # (Disabling OpenFGA should only be used for local development).
  enabled: true

# heimdall is the configuration for the heimdall middleware
heimdall:
  enabled: true
  url: http://lfx-platform-heimdall.lfx.svc.cluster.local:4456
  # jwksUrl is the URL to the JSON Web Key Set endpoint for JWT validation
  jwksUrl: http://lfx-platform-heimdall.lfx.svc.cluster.local:4457/.well-known/jwks
  # add_middleware determines whether or not the middleware is installed. If not managed
  # by another service or helm chart then it is needed.
  add_middleware: false

# authelia is the configuration for the Authelia server
authelia:
  # enabled is a boolean to determine if the Authelia authenticator is enabled
  # Note: Disabling Authelia should only be used for local development
  enabled: true

# nats is the configuration for the NATS server
nats:
  # url is the URL of the NATS server
  url: nats://lfx-platform-nats.lfx.svc.cluster.local:4222

# app is the configuration for the application
app:
  # logLevel is the log level (debug, info, warn, error)
  logLevel: debug
  # logAddSource is a boolean to determine if the log source should be added
  logAddSource: true
  # use_oidc_contextualizer is a boolean to determine if the OIDC contextualizer should be used
  use_oidc_contextualizer: true
  # formationTeamName is the OpenFGA team whose members may move a checklist
  # item's status. The gateway checks `member` on `team:<this>`, with no resource
  # in the object — the question is whether the caller is on the formation team,
  # not what they hold on the project. It is checked in addition to `writer` on
  # the project, and the pair is what keeps an assignee from closing their own
  # item.
  #
  # The architecture review names `team:lf-staff` for this guard; `formation` is
  # used because it is the team this route's second check can actually reach as
  # the rules are written.
  #
  # `team:formation` holds `global_owner`, which reaches the project's `owner`
  # and so satisfies the status route's other check. `team:lf-staff` is not
  # excluded by the model — it would need `global_writer`, which satisfies
  # `writer_guard`, the relation these rules now guard. Verified with `fga model
  # test` against the platform model: a `global_owner` team member checks true
  # on both `writer` and `writer_guard`, a `global_writer` team member false on
  # `writer` and true on `writer_guard`.
  #
  # So switching to `lf-staff` is a value change here plus a grant for that team
  # in the project-global-relations work. `formation` is used because it needs
  # neither, and because it is the team whose job the checklist is. The cost is
  # that an LF staff member outside the formation team cannot move a status,
  # which the review would have allowed.
  #
  # The same value in every environment, so it is a real default here rather than a
  # per-environment identifier. `type team` already defines `member: [user]` in the
  # platform model, so no model change is needed either.
  #
  # Both environments have the object populated. Membership is maintained by the
  # IT team outside this platform: nothing in these repos writes it, and the
  # LDAP-backed sync-global-groups CronJob covers only lf-staff and
  # lf-contractor. This chart neither creates the team nor seeds it, so a caller
  # refused by the second check is an IT membership question, not a chart defect.
  formationTeamName: "formation"
  # Team whose members may create project applications.
  # Add the UI service identity to this team before enabling the route.
  applicationIntakeTeamName: "global_project_application_admin"
  # jwt is the configuration for JWT authentication
  # audience is the intended audience for the JWT token
  audience: lfx-v2-formation-service

  # extraEnv allows injecting additional environment variables into the container.
  # Supports both simple key-value pairs and Kubernetes field references.
  # These are rendered BEFORE OTEL variables, allowing use in OTEL configuration.
  extraEnv: []

  # otel is the configuration for OpenTelemetry tracing
  otel:
    # serviceName is the service name for OpenTelemetry resource identification
    # (default: "lfx-v2-formation-service")
    # TODO(agaetep): will comments still get flushed out with values?
    serviceName: ""
    # serviceVersion is the service version for OpenTelemetry resource identification
    # (default: build-time Version variable)
    serviceVersion: ""
    # protocol specifies the OTLP protocol: "grpc" or "http"
    # (default: "grpc")
    protocol: "grpc"
    # endpoint is the OTLP collector endpoint
    # For gRPC: typically "host:4317", for HTTP: typically "host:4318"
    endpoint: ""
    # insecure disables TLS for the OTLP connection
    # Set to "true" for in-cluster communication without TLS
    insecure: "false"
    # tracesExporter specifies the traces exporter: "otlp" or "none"
    # (default: "none")
    tracesExporter: "none"
    # tracesSampleRatio specifies the sampling ratio for traces (0.0 to 1.0)
    # A value of 1.0 means all traces are sampled, 0.5 means 50% are sampled
    # (default: "1.0")
    tracesSampleRatio: "1.0"
    # metricsExporter specifies the metrics exporter: "otlp" or "none"
    # (default: "none")
    metricsExporter: "none"
    # logsExporter specifies the logs exporter: "otlp" or "none"
    # (default: "none")
    logsExporter: "none"
    # propagators specifies the trace context propagators to use
    # Comma-separated list of: "tracecontext", "baggage", "jaeger"
    # (default: "tracecontext,baggage")
    propagators: "tracecontext,baggage,jaeger"

  # environment contains all application environment variables
  # Each variable can have either a 'value' (for direct values) or 'valueFrom' (for secret references)
  environment:
    # NATS_URL is the URL of the NATS server (required)
    NATS_URL:
      value: nats://lfx-platform-nats.lfx.svc.cluster.local:4222

    # LOG_LEVEL is the log level (debug, info, warn, error) - optional, defaults to info
    LOG_LEVEL:
      value: info

    # LOG_ADD_SOURCE determines if log source should be added - optional, defaults to true
    LOG_ADD_SOURCE:
      value: true

    # JWKS_URL is the URL to the JSON Web Key Set endpoint for JWT validation
    # Required unless JWT_AUTH_DISABLED_MOCK_LOCAL_PRINCIPAL is set
    JWKS_URL:
      value: http://lfx-platform-heimdall.lfx.svc.cluster.local:4457/.well-known/jwks

    # AUDIENCE is the intended audience for the JWT token (required)
    AUDIENCE:
      value: lfx-v2-formation-service

    # APPLICATION_FORMATION_TEAM is the OpenFGA team granted `formation_team`
    # on every project application — the relation that gates accepting and
    # denying, and that lets staff read the queue.
    #
    # Unlike app.applicationIntakeTeamName this is not read by a gateway rule.
    # It is written into the tuple store as `team:<this>#member`, so a value
    # naming no real team produces a grant nobody satisfies: applications are
    # created, no member of staff can open them, and nothing reports a fault,
    # because the tuple write is fire-and-forget.
    #
    # It is a separate setting from the intake team, and now a different value
    # too: the intake grant belongs to a platform super-admin team holding
    # write on the type, while this one is the formation staff who work the
    # queue. Collapsing them would let the reviewing team mint applications
    # naming anyone as the applicant.
    APPLICATION_FORMATION_TEAM:
      value: formation

    # JWT_AUTH_DISABLED_MOCK_LOCAL_PRINCIPAL is used for local development to bypass JWT validation
    # Optional, local dev only. Set to a principal name to enable mock authentication.
    # Requires JWT_AUTH_DISABLED_MOCK_LOCAL_PRINCIPAL_CONFIRM=true to also be set, or the
    # service refuses to start — a single stray value here must not be able to silently
    # authenticate every request as a fixed principal.
    JWT_AUTH_DISABLED_MOCK_LOCAL_PRINCIPAL:
      value: ''

    # JWT_AUTH_DISABLED_MOCK_LOCAL_PRINCIPAL_CONFIRM must be exactly "true" for
    # JWT_AUTH_DISABLED_MOCK_LOCAL_PRINCIPAL to take effect. Optional, local dev only.
    JWT_AUTH_DISABLED_MOCK_LOCAL_PRINCIPAL_CONFIRM:
      value: ''

    # AUTH_SOURCE is the authentication source: 'jwt' for production, 'mock' for local dev (optional, defaults to jwt)
    AUTH_SOURCE:
      value: jwt

    # REPOSITORY_SOURCE is the repository implementation: 'postgres' for production, 'mock' for local dev
    # Optional, defaults to postgres. Production should use 'postgres', local development should use 'mock'
    REPOSITORY_SOURCE:
      value: postgres

    # RECONCILE_INTERVAL is how often the reconcile loop sweeps for projects that
    # entered formation without a checklist, and for lifecycles that need moving.
    # Optional, defaults to 24h. Accepts a Go duration ("30s", "5m", "1h").
    #
    # This is no longer the delay before a checklist appears. The service now
    # also listens for project changes and reconciles the project a change names,
    # which is what makes a checklist appear in seconds; the sweep is the backstop
    # that catches whatever the listener missed, and it is the only mechanism that
    # is guaranteed to run — the transport carrying those events has no
    # redelivery and delivers nothing at all while this service restarts.
    #
    # So this is the worst case only when the listener is not working, and that
    # is the scale the value is set for. Lower it while draining a backlog, or
    # while the listener is known to be down. Every replica sweeps; there is no
    # leader, so lowering it multiplies the read load by the replica count.
    RECONCILE_INTERVAL:
      value: 24h

    # QUERY_SERVICE_URL is the base URL of the shared read layer that the
    # platform-checked checklist rows (committee, mailing list) resolve
    # against. Optional, and empty here on purpose.
    #
    # Empty is the off switch: the service builds its lookup registry empty,
    # makes no outbound call, and reports those rows unanswerable exactly as
    # it did before this setting existed. Turning it on is an override in the
    # per-environment values hierarchy — dev first — and never a code change,
    # so an environment whose service identity has not been granted read
    # access yet simply leaves this unset rather than failing every row.
    QUERY_SERVICE_URL:
      value: ''

    # The service identity used for those lookups. A sweep has no caller, so
    # there is no bearer token to forward and the reads are made as this
    # service. The flow is an Auth0 client-credentials grant with a
    # private-key JWT assertion (RS256) — there is no client secret — and the
    # variable names match the ones lfx-v2-committee-service already uses to
    # read the same layer.
    #
    # All three are required once QUERY_SERVICE_URL is set. Leaving the URL
    # set and these empty is refused at startup rather than degraded, because
    # an unauthenticated read returns nothing and would report every row as
    # failed instead of unanswered.
    M2M_AUTH_CLIENT_ID:
      value: ''

    # M2M_AUTH_PRIVATE_KEY is an RSA private key in PEM form. Supply it with
    # valueFrom.secretKeyRef when enabling this in an environment; never as a
    # literal value, which would be readable from the pod spec.
    M2M_AUTH_PRIVATE_KEY:
      value: ''

    # M2M_AUTH_DOMAIN is the Auth0 tenant domain, e.g.
    # "linuxfoundation-dev.auth0.com".
    M2M_AUTH_DOMAIN:
      value: ''

    # M2M_AUTH_AUDIENCE is optional.
    M2M_AUTH_AUDIENCE:
      value: ''

# serviceAccount is the configuration for the Kubernetes service account (used by multiple components)
serviceAccount:
  # create specifies whether a service account should be created
  create: true
  # name is the name of the service account to use.
  # If not set and create is true, defaults to the chart name.
  name: ""
  # annotations to add to the service account
  annotations: {}
  # automountServiceAccountToken is a boolean to determine if the service account token should be automatically mounted
  automountServiceAccountToken: true
