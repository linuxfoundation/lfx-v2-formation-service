---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.traefik.gateway.name }}
      namespace: {{ .Values.traefik.gateway.namespace }}
  hostnames:
    - "lfx-api.{{ .Values.lfx.domain }}"
  rules:
  # Main application endpoints (with authentication)
  - matches:
    - path:
        type: Exact
        value: /formations
    - path:
        type: PathPrefix
        value: /formations/
    - path:
        type: PathPrefix
        value: /_formations/
    # Not under /formations, because an application is not a formation: it
    # exists before any project does, so there is no project UID to key it by.
    - path:
        type: Exact
        value: /project-applications
    - path:
        type: PathPrefix
        value: /project-applications/
    {{- if .Values.heimdall.enabled }}
    filters:
      - type: ExtensionRef
        extensionRef:
          group: traefik.io
          kind: Middleware
          name: heimdall-forward-body
    {{- end }}
    backendRefs:
      - group: ''
        kind: Service
        name: {{ .Chart.Name }}
        port: {{ .Values.service.port }}
        weight: 1
