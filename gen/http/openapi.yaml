swagger: "2.0"
info:
    title: LFX V2 Formation Service
    version: "1.0"
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /formations/{project_uid}:
        get:
            tags:
                - lfx_v2_formation_service
            summary: get_formation lfx_v2_formation_service
            description: Return the whole checklist for a project in one response — sections, items, progress and readiness. Items are never fetched individually (FR-031).
            operationId: lfx_v2_formation_service#get_formation
            parameters:
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  type: string
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FormationChecklist'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /formations/{project_uid}/activity:
        get:
            tags:
                - lfx_v2_formation_service
            summary: get_formation_activity lfx_v2_formation_service
            description: 'Return the formation''s activity feed, newest first, with ULID cursor paging. The feed covers checklist changes only — status changes, assignment, notes, links, skip reasons and template work. Permission changes never appear here: nothing keeps a history of them, since each save overwrites the previous state (FR-027).'
            operationId: lfx_v2_formation_service#get_formation_activity
            parameters:
                - name: cursor
                  in: query
                  description: Opaque ULID cursor from a previous page's next_cursor. Omit for the first page.
                  required: false
                  type: string
                - name: limit
                  in: query
                  description: Page size. Defaults to 20, capped at 100.
                  required: false
                  type: integer
                  default: 20
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  type: string
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FormationActivityPage'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
