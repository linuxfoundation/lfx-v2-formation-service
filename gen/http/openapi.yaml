swagger: "2.0"
info:
    title: LFX V2 Formation Service
    version: "1.0"
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /formations/{project_uid}:
        get:
            tags:
                - lfx_v2_formation_service
            summary: get_formation lfx_v2_formation_service
            description: Return the whole checklist for a project in one response — sections, items, progress and readiness. Items are never fetched individually.
            operationId: lfx_v2_formation_service#get_formation
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  type: string
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FormationChecklist'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /formations/{project_uid}/activity:
        get:
            tags:
                - lfx_v2_formation_service
            summary: get_formation_activity lfx_v2_formation_service
            description: 'Return the formation''s activity feed, newest first, with ULID cursor paging. The feed covers checklist changes only — status changes, assignment, notes, links, skip reasons and template work. Permission changes never appear here: nothing keeps a history of them, since each save overwrites the previous state. Pass item_uid to narrow the feed to one item''s history. A cursor belongs to the sequence that produced it, not to the feed generally: a next_cursor from a filtered read is only valid when replayed with the same item_uid, and one from an unfiltered read only without one. Mixing them is not rejected and does not error — it returns a correct page of a different sequence, which is the dangerous outcome, so a caller must carry the filter alongside the cursor.'
            operationId: lfx_v2_formation_service#get_formation_activity
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: cursor
                  in: query
                  description: Opaque ULID cursor from a previous page's next_cursor. Omit for the first page.
                  required: false
                  type: string
                - name: item_uid
                  in: query
                  description: Narrow the feed to one checklist item's history. This is the item's UID (as carried on each entry's item_uid), not the stable item_key the mutation routes take. Omit for the whole checklist's feed.
                  required: false
                  type: string
                  format: uuid
                - name: limit
                  in: query
                  description: Page size. Defaults to 20, capped at 100.
                  required: false
                  type: integer
                  default: 20
                  maximum: 100
                  minimum: 1
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  type: string
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FormationActivityPage'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /formations/{project_uid}/items/{item_key}:
        patch:
            tags:
                - lfx_v2_formation_service
            summary: update_item lfx_v2_formation_service
            description: 'Leave an update on one checklist item: a note, an evidence link. Neither moves a status nor directs anybody''s work, so this is the one item route open on read access. Send only the fields being changed; at least one is required. If-Match is required and must equal the item''s current version — a stale value means re-read and retry. The response returns the new version as ETag.'
            operationId: lfx_v2_formation_service#update_item
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  type: string
                - name: item_key
                  in: path
                  description: The item's stable key.
                  required: true
                  type: string
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
                - name: If-Match
                  in: header
                  description: Must equal the item's current version.
                  required: true
                  type: integer
                  format: int64
                - name: update_item_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LfxV2FormationServiceUpdateItemRequestBody'
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/LfxV2FormationServiceUpdateItemResponseBody'
                        required:
                            - uid
                            - item_key
                            - section_key
                            - position
                            - title
                            - gate
                            - requires_writer
                            - status_source
                            - is_required
                            - checklist_type
                            - status
                            - available_actions
                            - version
                    headers:
                        ETag:
                            description: The item's new version. Send as If-Match on the next write.
                            type: string
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "412":
                    description: Precondition Failed response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /formations/{project_uid}/items/{item_key}/assignment:
        post:
            tags:
                - lfx_v2_formation_service
            summary: assign_item lfx_v2_formation_service
            description: 'Direct one checklist item''s work: set or clear its assignee, set or clear its due date. Send only the fields being changed; at least one is required. Assignment is limited to people already holding a grant on the project. If-Match is required and must equal the item''s current version. The response returns the new version as ETag.'
            operationId: lfx_v2_formation_service#assign_item
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  type: string
                - name: item_key
                  in: path
                  description: The item's stable key.
                  required: true
                  type: string
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
                - name: If-Match
                  in: header
                  description: Must equal the item's current version.
                  required: true
                  type: integer
                  format: int64
                - name: assign_item_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LfxV2FormationServiceAssignItemRequestBody'
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/LfxV2FormationServiceAssignItemResponseBody'
                        required:
                            - uid
                            - item_key
                            - section_key
                            - position
                            - title
                            - gate
                            - requires_writer
                            - status_source
                            - is_required
                            - checklist_type
                            - status
                            - available_actions
                            - version
                    headers:
                        ETag:
                            description: The item's new version. Send as If-Match on the next write.
                            type: string
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "412":
                    description: Precondition Failed response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /formations/{project_uid}/items/{item_key}/status:
        post:
            tags:
                - lfx_v2_formation_service
            summary: set_item_status lfx_v2_formation_service
            description: Move one checklist item to a new status — in progress, blocked, done, skipped, or back to not started — or set the status of its sub-items. At least one of status and sub_items is required; both may travel together. If-Match is required and must equal the item's current version — a stale value means re-read and retry. The response returns the new version as ETag. Blocking, skipping and sending an item back each require a reason; the other transitions ignore one if sent.
            operationId: lfx_v2_formation_service#set_item_status
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  type: string
                - name: item_key
                  in: path
                  description: The item's stable key.
                  required: true
                  type: string
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
                - name: If-Match
                  in: header
                  description: Must equal the item's current version.
                  required: true
                  type: integer
                  format: int64
                - name: set_item_status_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LfxV2FormationServiceSetItemStatusRequestBody'
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/LfxV2FormationServiceSetItemStatusResponseBody'
                        required:
                            - uid
                            - item_key
                            - section_key
                            - position
                            - title
                            - gate
                            - requires_writer
                            - status_source
                            - is_required
                            - checklist_type
                            - status
                            - available_actions
                            - version
                    headers:
                        ETag:
                            description: The item's new version. Send as If-Match on the next write.
                            type: string
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "412":
                    description: Precondition Failed response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /project-applications:
        post:
            tags:
                - lfx_v2_formation_service
            summary: create_application lfx_v2_formation_service
            description: 'Submit an application to start a new foundation. Creates an application record and nothing else — no project, no checklist, no stage, no entity placement. The submitter''s identity is recorded from the payload rather than from the caller''s token: this route is called by the UI authenticating as itself, so the end user never presents a credential here. Anti-automation belongs to that caller; this service adds no second control. The response body carries revision 1; create does not duplicate it in an ETag header.'
            operationId: lfx_v2_formation_service#create_application
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
                - name: create_application_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LfxV2FormationServiceCreateApplicationRequestBody'
                    required:
                        - submitter_username
                        - submitter_name
                        - submitter_email
                        - application
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/ProjectApplication'
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/ApplicationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /project-applications/{uid}:
        put:
            tags:
                - lfx_v2_formation_service
            summary: revise_application lfx_v2_formation_service
            description: Replace an application's answers without changing its state.
            operationId: lfx_v2_formation_service#revise_application
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: uid
                  in: path
                  description: The application's unique identifier.
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
                - name: If-Match
                  in: header
                  description: Must equal the application's current revision.
                  required: true
                  type: integer
                  format: int64
                - name: revise_application_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LfxV2FormationServiceReviseApplicationRequestBody'
                    required:
                        - application
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/LfxV2FormationServiceReviseApplicationResponseBody'
                        required:
                            - uid
                            - state
                            - revision
                            - submitter_username
                            - submitter_name
                            - submitter_email
                            - application
                            - created_at
                            - updated_at
                    headers:
                        ETag:
                            description: The application's new revision. Send as If-Match on the next write.
                            type: string
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/ApplicationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/ApplicationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "412":
                    description: Precondition Failed response.
                    schema:
                        $ref: '#/definitions/ApplicationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
        delete:
            tags:
                - lfx_v2_formation_service
            summary: delete_application lfx_v2_formation_service
            description: Delete an application from storage and search, and remove its submitter grant. The formation-team tuple is retained.
            operationId: lfx_v2_formation_service#delete_application
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: uid
                  in: path
                  description: The application's unique identifier.
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
                - name: If-Match
                  in: header
                  description: Must equal the application's current revision.
                  required: true
                  type: integer
                  format: int64
            responses:
                "204":
                    description: No Content response.
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/ApplicationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "412":
                    description: Precondition Failed response.
                    schema:
                        $ref: '#/definitions/ApplicationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /project-applications/{uid}/accept:
        post:
            tags:
                - lfx_v2_formation_service
            summary: accept_application lfx_v2_formation_service
            description: Accept an application without creating a project.
            operationId: lfx_v2_formation_service#accept_application
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: uid
                  in: path
                  description: The application's unique identifier.
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
                - name: If-Match
                  in: header
                  description: Must equal the application's current revision.
                  required: true
                  type: integer
                  format: int64
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/LfxV2FormationServiceAcceptApplicationResponseBody'
                        required:
                            - uid
                            - state
                            - revision
                            - submitter_username
                            - submitter_name
                            - submitter_email
                            - application
                            - created_at
                            - updated_at
                    headers:
                        ETag:
                            description: The application's new revision. Send as If-Match on the next write.
                            type: string
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/ApplicationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "412":
                    description: Precondition Failed response.
                    schema:
                        $ref: '#/definitions/ApplicationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /project-applications/{uid}/deny:
        post:
            tags:
                - lfx_v2_formation_service
            summary: deny_application lfx_v2_formation_service
            description: Deny an application and retain its record.
            operationId: lfx_v2_formation_service#deny_application
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: uid
                  in: path
                  description: The application's unique identifier.
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
                - name: If-Match
                  in: header
                  description: Must equal the application's current revision.
                  required: true
                  type: integer
                  format: int64
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/LfxV2FormationServiceDenyApplicationResponseBody'
                        required:
                            - uid
                            - state
                            - revision
                            - submitter_username
                            - submitter_name
                            - submitter_email
                            - application
                            - created_at
                            - updated_at
                    headers:
                        ETag:
                            description: The application's new revision. Send as If-Match on the next write.
                            type: string
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/ApplicationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "412":
                    description: Precondition Failed response.
                    schema:
                        $ref: '#/definitions/ApplicationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /project-applications/{uid}/withdraw:
        post:
            tags:
                - lfx_v2_formation_service
            summary: withdraw_application lfx_v2_formation_service
            description: Withdraw an application and retain its record.
            operationId: lfx_v2_formation_service#withdraw_application
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: uid
                  in: path
                  description: The application's unique identifier.
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
                - name: If-Match
                  in: header
                  description: Must equal the application's current revision.
                  required: true
                  type: integer
                  format: int64
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/LfxV2FormationServiceWithdrawApplicationResponseBody'
                        required:
                            - uid
                            - state
                            - revision
                            - submitter_username
                            - submitter_name
                            - submitter_email
                            - application
                            - created_at
                            - updated_at
                    headers:
                        ETag:
                            description: The application's new revision. Send as If-Match on the next write.
                            type: string
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/ApplicationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "412":
                    description: Precondition Failed response.
                    schema:
                        $ref: '#/definitions/ApplicationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
definitions:
    ApplicationError:
        title: ApplicationError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: "400"
            message:
                type: string
                description: Human-readable message
                example: Dicta doloremque hic officiis quo tempore saepe.
            name:
                type: string
                description: Which declared error this is — matches the Error() name. Transport dispatch only; switch on reason, not this.
                example: Ex aut magnam eius sunt commodi voluptatem.
            reason:
                type: string
                description: Machine-readable; switch on this, not on status.
                example: formation_list_invalid
                enum:
                    - not_found
                    - application_uid_invalid
                    - version_mismatch
                    - submitter_username_required
                    - project_website_invalid
                    - formation_list_invalid
                    - application_field_invalid
                    - application_payload_too_large
        description: The payload itself is invalid
