        required:
            - code
            - message
    ProjectApplication:
        title: 'Mediatype identifier: application/vnd.project.application+json; view=default'
        type: object
        properties:
            application:
                type: object
                description: The intake answers, as submitted.
                example:
                    Dolor aut.: Quia odit facere ex aut reiciendis.
                additionalProperties: true
            created_at:
                type: string
                example: "1995-09-12T12:09:00Z"
                format: date-time
            revision:
                type: integer
                description: Echo as If-Match on every mutation.
                example: 5655728428719745020
                format: int64
            state:
                type: string
                description: Where the application stands. accepted and denied are the two decided outcomes.
                example: submitted
            submitter_email:
                type: string
                example: Tenetur cupiditate.
            submitter_name:
                type: string
                example: Quod ipsa aut beatae quasi.
            submitter_username:
                type: string
                example: Nisi saepe sunt qui porro ab fugit.
            target_parent_uid:
                type: string
                description: Absent unless the applicant started from somewhere. A hint, never a placement.
                example: Est voluptates omnis atque.
            uid:
                type: string
                description: The application's UID. The FGA object id and the indexed document id are both this value.
                example: Ut ea sit et et.
            updated_at:
                type: string
                example: "1989-10-15T15:50:04Z"
                format: date-time
        description: create_application_response_body result type (default view)
        example:
            application:
                Deserunt non.: Sit asperiores nulla minus nisi ipsam.
                Non optio enim.: Enim corporis soluta.
                Voluptate dolore.: Aspernatur voluptatibus provident consequatur esse et.
            created_at: "1984-11-05T21:14:59Z"
            revision: 5257719389711472501
            state: submitted
            submitter_email: Aut corporis optio iure.
            submitter_name: Voluptas temporibus.
            submitter_username: Omnis id tempora dolor labore soluta.
            target_parent_uid: Laborum adipisci corrupti dicta culpa.
            uid: Voluptatem sunt quaerat quo id qui quidem.
            updated_at: "1999-03-06T01:24:29Z"
        required:
            - uid
            - state
            - revision
            - submitter_username
            - submitter_name
            - submitter_email
            - application
            - created_at
            - updated_at
