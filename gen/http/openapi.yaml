                            - message
                            - reason
                "412":
                    description: Precondition Failed response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
