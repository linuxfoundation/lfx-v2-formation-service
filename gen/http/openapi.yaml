swagger: "2.0"
info:
    title: LFX V2 Formation Service
    version: "1.0"
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /formations/{project_uid}:
        get:
            tags:
                - lfx_v2_formation_service
            summary: get_formation lfx_v2_formation_service
            description: Return the whole checklist for a project in one response — sections, items, progress and readiness. Items are never fetched individually.
            operationId: lfx_v2_formation_service#get_formation
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  type: string
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FormationChecklist'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /formations/{project_uid}/activity:
        get:
            tags:
                - lfx_v2_formation_service
            summary: get_formation_activity lfx_v2_formation_service
            description: 'Return the formation''s activity feed, newest first, with ULID cursor paging. The feed covers checklist changes only — status changes, assignment, notes, links, skip reasons and template work. Permission changes never appear here: nothing keeps a history of them, since each save overwrites the previous state.'
            operationId: lfx_v2_formation_service#get_formation_activity
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: cursor
                  in: query
                  description: Opaque ULID cursor from a previous page's next_cursor. Omit for the first page.
                  required: false
                  type: string
                - name: limit
                  in: query
                  description: Page size. Defaults to 20, capped at 100.
                  required: false
                  type: integer
                  default: 20
                  maximum: 100
                  minimum: 1
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  type: string
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FormationActivityPage'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /formations/{project_uid}/items/{item_key}:
        patch:
            tags:
                - lfx_v2_formation_service
            summary: update_item lfx_v2_formation_service
            description: 'Change one checklist item: status, note, due date, skip reason, evidence link, assignee, or sub-items. Send only the fields being changed. If-Match is required and must equal the item''s current version — a stale value means re-read and retry. This route also carries the assignee''s own completion claim (status: awaiting_acceptance), but never acceptance, rejection or reopening, which are their own routes because the formation-team guard on those is narrower than this route''s writer guard and a Heimdall rule cannot express that on a shared route.'
            operationId: lfx_v2_formation_service#update_item
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  type: string
                - name: item_key
                  in: path
                  description: The item's stable key.
                  required: true
                  type: string
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
                - name: If-Match
                  in: header
                  description: Must equal the item's current version.
                  required: true
                  type: integer
                  format: int64
                - name: update_item_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LfxV2FormationServiceUpdateItemRequestBody'
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FormationItem'
                        required:
                            - uid
                            - item_key
                            - section_key
                            - position
                            - title
                            - gate
                            - requires_writer
                            - status_source
                            - is_required
                            - checklist_type
                            - status
                            - version
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "412":
                    description: Precondition Failed response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /formations/{project_uid}/items/{item_key}/accept:
        post:
            tags:
                - lfx_v2_formation_service
            summary: accept_item lfx_v2_formation_service
            description: Accept an item's completion claim, moving awaiting_acceptance to done. Restricted to the formation team at the gateway, and refused by the service when the caller is the item's own assignee. If-Match is required.
            operationId: lfx_v2_formation_service#accept_item
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  type: string
                - name: item_key
                  in: path
                  description: The item's stable key.
                  required: true
                  type: string
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
                - name: If-Match
                  in: header
                  description: Must equal the item's current version.
                  required: true
                  type: integer
                  format: int64
                - name: accept_item_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LfxV2FormationServiceAcceptItemRequestBody'
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FormationItem'
                        required:
                            - uid
                            - item_key
                            - section_key
                            - position
                            - title
                            - gate
                            - requires_writer
                            - status_source
                            - is_required
                            - checklist_type
                            - status
                            - version
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "412":
                    description: Precondition Failed response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /formations/{project_uid}/items/{item_key}/reject:
        post:
            tags:
                - lfx_v2_formation_service
            summary: reject_item lfx_v2_formation_service
            description: 'Reject an item''s completion claim, returning it to in_progress with a note the assignee can read. The note is required: a rejection with no reason leaves the assignee nothing to act on. Restricted to the formation team at the gateway.'
            operationId: lfx_v2_formation_service#reject_item
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  type: string
                - name: item_key
                  in: path
                  description: The item's stable key.
                  required: true
                  type: string
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
                - name: If-Match
                  in: header
                  description: Must equal the item's current version.
                  required: true
                  type: integer
                  format: int64
                - name: reject_item_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LfxV2FormationServiceRejectItemRequestBody'
                    required:
                        - note
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FormationItem'
                        required:
                            - uid
                            - item_key
                            - section_key
                            - position
                            - title
                            - gate
                            - requires_writer
                            - status_source
                            - is_required
                            - checklist_type
                            - status
                            - version
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "412":
                    description: Precondition Failed response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /formations/{project_uid}/items/{item_key}/reopen:
        post:
            tags:
                - lfx_v2_formation_service
            summary: reopen_item lfx_v2_formation_service
            description: 'Reopen a done item, returning it to in_progress. Behind the same guard as acceptance rather than the ordinary write guard: reopening is the reversal of an acceptance, and a weaker check here would make the acceptance control bypassable from the other side. Reopening a gating item withdraws readiness.'
            operationId: lfx_v2_formation_service#reopen_item
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  required: true
                  type: string
                  enum:
                    - "1"
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  type: string
                - name: item_key
                  in: path
                  description: The item's stable key.
                  required: true
                  type: string
                - name: Authorization
                  in: header
                  description: JWT token issued by Heimdall
                  required: false
                  type: string
                - name: If-Match
                  in: header
                  description: Must equal the item's current version.
                  required: true
                  type: integer
                  format: int64
                - name: reopen_item_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LfxV2FormationServiceReopenItemRequestBody'
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FormationItem'
                        required:
                            - uid
                            - item_key
                            - section_key
                            - position
                            - title
                            - gate
                            - requires_writer
                            - status_source
                            - is_required
                            - checklist_type
                            - status
                            - version
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
                            - code
                            - message
                            - reason
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/FormationError'
                        required:
                            - name
