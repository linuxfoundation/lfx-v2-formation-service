components:
    schemas:
        AdminTemplate:
            type: object
            properties:
                author:
                    type: string
                    example: Distinctio sequi culpa velit.
                created_at:
                    type: string
                    example: "1980-10-27T13:21:09Z"
                    format: date-time
                match:
                    type: string
                    description: Match rule that governs selection; currently only 'always' is supported.
                    example: always
                    enum:
                        - always
                name:
                    type: string
                    example: Nulla odio.
                priority:
                    type: integer
                    description: Selection priority; lower value wins when multiple templates match.
                    example: 3578666294456092186
                    format: int64
                published_at:
                    type: string
                    example: "1987-08-03T14:55:46Z"
                    format: date-time
                sections:
                    description: Array of template sections.
                    example: Excepturi dolorem totam aut possimus id.
                state:
                    type: string
                    description: 'Lifecycle state: draft → published (immutable) or archived.'
                    example: published
                    enum:
                        - draft
                        - published
                        - archived
                template_version:
                    type: integer
                    description: The template's own version number, distinct from the API version.
                    example: 382422010728771763
                    format: int64
                uid:
                    type: string
                    example: Odit vero quia in eveniet quia.
                updated_at:
                    type: string
                    example: "1991-12-30T08:58:17Z"
                    format: date-time
            example:
                author: Est alias dicta.
                created_at: "1988-06-21T14:15:30Z"
                match: always
                name: Id enim quisquam rem sequi dolores.
                priority: 1868699831520659975
                published_at: "2002-09-26T04:07:31Z"
                sections: Itaque repellat ex.
                state: archived
                template_version: 3048725857257436003
                uid: Autem enim.
                updated_at: "2014-03-30T04:13:37Z"
            required:
                - uid
                - name
                - template_version
                - state
                - priority
                - match
                - sections
                - created_at
                - updated_at
        ApplicationError:
            type: object
            properties:
                code:
                    type: string
                    description: HTTP status code
                    example: "400"
                message:
                    type: string
                    description: Human-readable message
                    example: Ex nemo unde quisquam sapiente numquam.
                name:
                    type: string
                    description: Which declared error this is — matches the Error() name. Transport dispatch only; switch on reason, not this.
                    example: Modi sit eos.
                reason:
                    type: string
                    description: Machine-readable; switch on this, not on status.
                    example: application_field_invalid
                    enum:
                        - not_found
                        - application_uid_invalid
                        - version_mismatch
                        - submitter_username_required
                        - project_website_invalid
                        - formation_list_invalid
                        - application_field_invalid
                        - application_payload_too_large
            example:
                code: "400"
                message: Velit rem.
                name: Quia atque.
                reason: formation_list_invalid
            required:
                - name
                - code
                - message
                - reason
        AssignItemRequestBody:
            type: object
            properties:
                assignee:
                    type: string
                    description: Username, or an empty string to clear.
                    example: Voluptatibus non iure voluptas.
                due_date:
                    type: string
                    description: YYYY-MM-DD, or an empty string to clear.
                    example: "2026-03-31"
            example:
                assignee: Exercitationem aut ducimus voluptatem nobis nam qui.
                due_date: "2026-03-31"
        CreateApplicationRequestBody:
            type: object
            properties:
                application:
                    type: object
                    description: 'The intake answers. Canonical keys (all optional): project_name (string); project_repository_url (string; nonblank HTTP or HTTPS URL with a hostname); project_website (string; nonblank legacy HTTP or HTTPS URL, hostname optional); trademark_status (string); contributing_organization (string); legal_contact_email (string; when nonblank, exactly one non-edge @ and no whitespace or control characters); formation_list (list of strings using the legacy email-shape rule); license (string); chat_platform (string); mission_statement (string); agreement_type (string); is_spec_project (boolean); description (string). Missing and null are accepted for every key; blank strings are accepted for string, URL, and legal-contact fields. Unknown keys are retained. Create and revise apply identical validation. People named for the formation work are email addresses only — they are not resolved to platform identities, granted anything, or notified.'
                    example:
                        Sequi similique possimus sint repellendus repellendus inventore.: Maiores neque consequatur beatae quia nostrum.
                        Ullam repellat sed quia neque.: Corrupti qui facilis.
                    additionalProperties: true
                submitter_email:
                    type: string
                    description: The applicant's email address.
                    example: jasmin@marks.info
                    format: email
                submitter_name:
                    type: string
                    description: The applicant's display name.
                    example: Dolores illo aperiam ratione et impedit.
                submitter_username:
                    type: string
                    description: The applicant's username, as the calling UI knows it.
                    example: Tempore beatae sint soluta ut exercitationem repellendus.
                target_parent_uid:
                    type: string
                    description: Optional. Where the applicant started from, carried as a hint to prefill the approver's form. It does not decide the parent or the incorporated entity, and it grants nobody anything. Normally absent.
                    example: Voluptate non quibusdam harum nesciunt neque.
            example:
                application:
                    Fugiat culpa aliquid.: Perspiciatis molestias velit.
                    Quae laboriosam et id consectetur ratione.: Et corporis aut quas consequatur eius.
                    Tempora sint rem.: Natus architecto.
                submitter_email: magnus@hoeger.info
                submitter_name: Odit beatae praesentium repellendus quo laborum dolore.
                submitter_username: Numquam ad voluptas velit exercitationem earum aut.
                target_parent_uid: Quo aut tempora et est.
            required:
                - submitter_username
                - submitter_name
                - submitter_email
                - application
        CreateTemplateRequestBody:
            type: object
            properties:
                author:
                    type: string
                    example: Mollitia aperiam culpa quas.
                match:
                    type: string
                    description: Match rule. Currently only 'always' is supported.
                    example: always
                    enum:
                        - always
                name:
                    type: string
                    description: Template name. Combined with template_version for uniqueness.
                    example: Minima et.
                priority:
                    type: integer
                    description: Selection priority; lower wins.
                    example: 4023371723970176311
                    format: int64
                    minimum: 0
                sections:
                    description: Array of template sections. Must be a JSON array of section objects.
                    example: Ut qui possimus fugiat.
                template_version:
                    type: integer
                    description: Version number. name+template_version must be unique.
                    example: 942713039990223988
                    format: int64
                    minimum: 1
            example:
                author: Quo provident voluptas.
                match: always
                name: Sed animi quo soluta nihil.
                priority: 8918349823874890286
                sections: Optio quia facilis velit exercitationem.
                template_version: 8206681703458331836
            required:
                - name
                - template_version
                - priority
                - match
                - sections
        FormationActivityEntry:
            type: object
            properties:
                action:
                    type: string
                    example: Veritatis consequatur architecto quisquam amet.
                actor:
                    type: string
                    example: Architecto dolores tempore.
                after:
                    example: Rerum nemo.
                at:
                    type: string
                    example: "1977-05-06T17:40:38Z"
                    format: date-time
                before:
                    description: Redacted summary.
                    example: Eveniet amet quibusdam commodi alias rem natus.
                item_uid:
                    type: string
                    description: Nullable. Absent means either a formation-level entry — template expansion or upgrade, which concern no single item — or an entry whose item has since been removed, since the reference is cleared rather than the row deleted. The two are indistinguishable here. Neither is ever returned by a read filtered on item_uid.
                    example: Itaque quod consequatur maiores.
                set_by:
                    type: string
                    example: system
                    enum:
                        - user
                        - system
                ulid:
                    type: string
                    description: Time-ordered; doubles as the paging cursor.
                    example: Sapiente vero aut enim.
            example:
                action: Nesciunt ut doloribus tempora est ut non.
                actor: Non occaecati.
                after: Non laborum quas qui labore.
                at: "1976-06-03T17:08:57Z"
                before: Et et sint consequatur quis minus.
