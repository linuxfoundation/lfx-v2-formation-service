    /formations/{project_uid}/activity:
        get:
            tags:
                - lfx_v2_formation_service
            summary: get_formation_activity lfx_v2_formation_service
            description: 'Return the formation''s activity feed, newest first, with ULID cursor paging. The feed covers checklist changes only — status changes, assignment, notes, links, skip reasons and template work. Permission changes never appear here: nothing keeps a history of them, since each save overwrites the previous state. Pass item_uid to narrow the feed to one item''s history. A cursor belongs to the sequence that produced it, not to the feed generally: a next_cursor from a filtered read is only valid when replayed with the same item_uid, and one from an unfiltered read only without one. Mixing them is not rejected and does not error — it returns a correct page of a different sequence, which is the dangerous outcome, so a caller must carry the filter alongside the cursor.'
            operationId: lfx_v2_formation_service#get_formation_activity
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  allowEmptyValue: true
                  required: true
                  schema:
                    type: string
                    description: API version. Must be 1.
                    example: "1"
                    enum:
                        - "1"
                  example: "1"
                - name: cursor
                  in: query
                  description: Opaque ULID cursor from a previous page's next_cursor. Omit for the first page.
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Opaque ULID cursor from a previous page's next_cursor. Omit for the first page.
                    example: Dolor ut similique veritatis dolorem occaecati.
                  example: Rerum voluptates aut rem dolor.
                - name: item_uid
                  in: query
                  description: Narrow the feed to one checklist item's history. This is the item's UID (as carried on each entry's item_uid), not the stable item_key the mutation routes take. Omit for the whole checklist's feed.
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Narrow the feed to one checklist item's history. This is the item's UID (as carried on each entry's item_uid), not the stable item_key the mutation routes take. Omit for the whole checklist's feed.
                    example: 675baeaa-463f-4753-b6a4-d7581ab95801
                    format: uuid
                  example: cb1040ad-41e8-4dcd-a076-1e3dd08759f7
                - name: limit
                  in: query
                  description: Page size. Defaults to 20, capped at 100.
                  allowEmptyValue: true
                  schema:
                    type: integer
                    description: Page size. Defaults to 20, capped at 100.
                    default: 20
                    example: 17
                    format: int64
                    minimum: 1
                    maximum: 100
                  example: 65
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  schema:
                    type: string
                    description: The project's UID.
                    example: Ut neque a animi qui.
                  example: Quae numquam.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FormationActivityPage'
                            example:
                                entries:
                                    - action: Sed magnam molestiae et reprehenderit qui.
                                      actor: Dignissimos dolores adipisci et necessitatibus.
                                      after: Eum laborum sequi itaque sed nihil.
                                      at: "1993-06-17T15:24:29Z"
                                      before: Omnis ea deleniti ad perferendis culpa amet.
                                      item_uid: Asperiores iure eveniet.
                                      set_by: user
                                      ulid: Temporibus est repellendus et aspernatur sapiente.
                                    - action: Sed magnam molestiae et reprehenderit qui.
                                      actor: Dignissimos dolores adipisci et necessitatibus.
                                      after: Eum laborum sequi itaque sed nihil.
