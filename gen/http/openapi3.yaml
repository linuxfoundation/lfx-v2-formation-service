                    type: string
                    description: API version. Must be 1.
                    example: "1"
                    enum:
                        - "1"
                  example: "1"
                - name: project_uid
                  in: path
                  description: The project's UID.
                  required: true
                  schema:
                    type: string
                    description: The project's UID.
                    example: Magnam consequuntur nam eius esse aut.
                  example: Fugit eveniet reprehenderit porro dolorem eveniet qui.
                - name: item_key
                  in: path
                  description: The item's stable key.
                  required: true
                  schema:
                    type: string
                    description: The item's stable key.
