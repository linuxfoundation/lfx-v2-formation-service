            description: Move one checklist item to a new status — in progress, blocked, done, skipped, or back to not started — or set the status of its sub-items. At least one of status and sub_items is required; both may travel together. If-Match is required and must equal the item's current version — a stale value means re-read and retry. The response returns the new version as ETag. Blocking, skipping and sending an item back each require a reason; the other transitions ignore one if sent.
