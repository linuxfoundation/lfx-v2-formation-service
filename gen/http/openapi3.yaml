        TemplateError:
            type: object
            properties:
                code:
                    type: string
                    description: HTTP status code
                    example: "409"
                message:
                    type: string
                    description: Human-readable message
                    example: Voluptatem soluta nam qui non et.
                name:
                    type: string
                    description: Which declared error this is — matches the Error() name (e.g. "Conflict"). Transport dispatch only; switch on reason, not this.
                    example: Qui est illo recusandae dignissimos consequatur.
                reason:
                    type: string
                    description: Machine-readable; switch on this, not on status.
                    example: template_not_draft
                    enum:
                        - not_found
                        - template_not_draft
                        - template_already_archived
                        - template_already_exists
                        - no_fields_to_update
                        - invalid_sections
