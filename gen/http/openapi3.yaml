            summary: update_item lfx_v2_formation_service
            description: 'Change one checklist item: status, note, due date, skip reason, evidence link, assignee, or sub-items. Send only the fields being changed. If-Match is required and must equal the item''s current version — a stale value means re-read and retry. The response returns the new version as ETag, so consecutive writes need no re-read. This route also carries the assignee''s own completion claim (status: awaiting_acceptance), but never acceptance, rejection or reopening, which are their own routes because the formation-team guard on those is narrower than this route''s writer guard and a Heimdall rule cannot express that on a shared route.'
            operationId: lfx_v2_formation_service#update_item
            parameters:
                - name: v
                  in: query
                  description: API version. Must be 1.
                  allowEmptyValue: true
                  required: true
